name: Testes

on:
  push:
    branches: [Dev, master]
  pull_request:
    branches: [Dev, master]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Instalar dependências
        run: pnpm install

      - name: Executar testes
        run: pnpm test
